
services:

  modo-folder:
    build:  .
    ports:
      - "8000:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./folder/:/docs

    stdin_open: true
    tty: true


  modo-suffix:
    build:  .
    ports:
      - "8001:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./suffix/:/docs

    stdin_open: true
    tty: true


  override:
    build:  .
    ports:
      - "8002:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./override/:/docs

    stdin_open: true
    tty: true


  search:
    build:  .
    ports:
      - "8003:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./search/:/docs

    stdin_open: true
    tty: true