
services:

  modo-folder:
    build:  .
    ports:
      - "8000:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./folder/:/docs

    stdin_open: true
    tty: true


  modo-suffix:
    build:  .
    ports:
      - "8001:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./suffix/:/docs

    stdin_open: true
    tty: true
