
services:

  modo-folder:
    build:  .
    ports:
      - "${PORT0:-8000}:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./folder/:/docs

    stdin_open: true
    tty: true


  modo-suffix:
    build:  .
    ports:
      - "${PORT1:-8001}:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./suffix/:/docs

    stdin_open: true
    tty: true


  override:
    build:  .
    ports:
      - "${PORT2:-8002}:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./override/:/docs

    stdin_open: true
    tty: true


  search:
    build:  .
    ports:
      - "${PORT3:-8003}:8000"
    security_opt: 
      - label=disable
    volumes:
      - ./search/:/docs

    stdin_open: true
    tty: true